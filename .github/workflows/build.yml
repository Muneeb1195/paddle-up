name: Build & Release

# CI for Paddle Up (Godot 4.7, Android).
# - Validates the project headless (import + boot gate, zero ERROR lines).
# - Exports all four Android ABI presets as release APKs, signed with the
#   release keystore restored from repository secrets.
# - On tag push (v*), attaches the APKs to a GitHub Release.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64 - base64 of the release .keystore file
#   KEYSTORE_ALIAS          - key alias (keystore/release_user)
#   KEYSTORE_PASSWORD       - keystore + key password (release_password)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"
  ANDROID_PLATFORM: "android-34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 \
            libasound2t64 libfontconfig1 unzip

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;${{ env.ANDROID_PLATFORM }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"
          yes | sdkmanager --licenses > /dev/null

      - name: Install Godot + export templates
        run: |
          GODOT_TAG="${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}"
          mkdir -p "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_STATUS }}"
          curl -fL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/.local/bin"
          curl -fL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* \
            "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_STATUS }}/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          Godot_v${GODOT_TAG}_linux.x86_64 --version

      - name: Import project (refresh class cache)
        run: |
          Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64 \
            --headless --path . --import

      - name: Boot gate (zero errors/warnings)
        run: |
          Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64 \
            --headless --path . --quit-after 30 2>&1 | tee boot.log
          if grep -q "ERROR" boot.log; then
            echo "Boot gate failed: ERROR lines detected"
            exit 1
          fi

      - name: Restore release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 secret"
            exit 1
          fi
          mkdir -p android
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Inject keystore into export presets
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Missing KEYSTORE_ALIAS / KEYSTORE_PASSWORD secrets"
            exit 1
          fi
          sed -i 's|^keystore/release=""|keystore/release="android/release.keystore"|' export_presets.cfg
          sed -i "s|^keystore/release_user=\"\"|keystore/release_user=\"$KEYSTORE_ALIAS\"|" export_presets.cfg
          sed -i "s|^keystore/release_password=\"\"|keystore/release_password=\"$KEYSTORE_PASSWORD\"|" export_presets.cfg
          grep -c 'keystore/release="android/release.keystore"' export_presets.cfg

      - name: Export Android APKs (all ABIs)
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          BIN="Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64"
          mkdir -p builds
          $BIN --headless --path . --export-release "Android-arm64-v8a" "builds/PaddleUp-v1.7.2-arm64-v8a.apk"
          $BIN --headless --path . --export-release "Android-armeabi-v7a" "builds/PaddleUp-v1.7.2-armeabi-v7a.apk"
          $BIN --headless --path . --export-release "Android-x86" "builds/PaddleUp-v1.7.2-x86.apk"
          $BIN --headless --path . --export-release "Android-x86_64" "builds/PaddleUp-v1.7.2-x86_64.apk"
          ls -la builds/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paddle-up-v1.7.2-apks
          path: builds/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: paddle-up-v1.7.2-apks
          path: builds

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: builds/*.apk
          generate_release_notes: true
